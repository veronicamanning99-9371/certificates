<title>Oceania 2026 Certificates</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@1,600;1,700&display=swap"><style id="css">/* Layout: navy meet-day header band, then one centred column (max 960px) that holds search, nation board and lists; admin reuses the column with a sticky publish bar. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#EAEEF7; --line:#D6DCEA;
  --ink:#1B1A47; --muted:#586082; --navy:#31308B; --cyan:#037E9E; --cyan-bright:#02A8CB;
  --band:#24236B; --band-ink:#FFFFFF; --band-muted:#B9C3F2;
  --gold:#9A7410; --gold-bg:#FBF1D2; --silver:#5E6778; --silver-bg:#ECEFF4; --bronze:#8A4E22; --bronze-bg:#F7E6D8;
  --ok:#1D7A4C; --ok-bg:#E2F4EA; --warn:#8A5A00; --warn-bg:#FFF2D6; --bad:#A3262E; --bad-bg:#FBE4E5;
  --focus:#02A8CB;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F22; --surface:#161937; --surface-2:#1E2246; --line:#2C3160;
  --ink:#E8EAF8; --muted:#A3A9CB; --navy:#AFB2FF; --cyan:#45C9E8; --cyan-bright:#45C9E8;
  --band:#13153A; --band-ink:#FFFFFF; --band-muted:#A8B3E6;
  --gold:#F0C95A; --gold-bg:#3A3015; --silver:#C9D0DC; --silver-bg:#2A2F44; --bronze:#E9A574; --bronze-bg:#3B2A1E;
  --ok:#6FD6A0; --ok-bg:#163527; --warn:#F2C46B; --warn-bg:#3A2E12; --bad:#F59AA0; --bad-bg:#3D1C20;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F22; --surface:#161937; --surface-2:#1E2246; --line:#2C3160;
  --ink:#E8EAF8; --muted:#A3A9CB; --navy:#AFB2FF; --cyan:#45C9E8; --cyan-bright:#45C9E8;
  --band:#13153A; --band-ink:#FFFFFF; --band-muted:#A8B3E6;
  --gold:#F0C95A; --gold-bg:#3A3015; --silver:#C9D0DC; --silver-bg:#2A2F44; --bronze:#E9A574; --bronze-bg:#3B2A1E;
  --ok:#6FD6A0; --ok-bg:#163527; --warn:#F2C46B; --warn-bg:#3A2E12; --bad:#F59AA0; --bad-bg:#3D1C20;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header band */
.band{background:var(--band);color:var(--band-ink);background-image:repeating-linear-gradient(-20deg,transparent 0 46px,rgba(2,168,203,.10) 46px 48px,transparent 48px 120px)}
.band .wrap{display:flex;gap:16px;align-items:center;padding-block:18px 20px}
.logo-tile{flex:0 0 auto;width:72px;height:62px;background:#FFFFFF;border-radius:8px;display:grid;place-items:center;padding:5px}
.logo-tile img{width:100%;height:100%;object-fit:contain;display:block}
.band .eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--band-muted);font-weight:600}
.band h1{font-size:clamp(24px,5.4vw,36px);font-weight:700}
.band .meta{color:var(--band-muted);font-size:15px;margin-top:2px}
.band-inner{min-width:0}

main.wrap{padding-block:20px 40px;display:grid;gap:20px}
.modebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* search */
.finder{display:grid;gap:10px}
.finder label.big{font-family:var(--f-display);font-size:22px;font-weight:700}
.finder-row{display:grid;grid-template-columns:1fr minmax(0,190px);gap:8px}
@media (max-width:520px){.finder-row{grid-template-columns:1fr}}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:17px;min-width:0}
textarea.input{font-size:15px;resize:vertical}
.input:focus{border-color:var(--cyan-bright);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan-bright) 25%,transparent)}
.hint{color:var(--muted);font-size:14px}

/* nation board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.nation{display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.nation:hover{border-color:var(--cyan-bright)}
.nation .code{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:.04em;color:var(--navy);line-height:1}
.nation .nm{font-weight:600}
.nation .ct{color:var(--muted);font-size:14px}
.section-head{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.section-head h2{font-size:26px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;counter-reset:s}
@media (max-width:600px){.steps{grid-template-columns:1fr}}
.steps li{list-style:none;display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:15px}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--cyan)}
.steps{padding:0;margin:0}

/* people list */
.list{display:grid;gap:8px}
.person{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.person:hover{border-color:var(--cyan-bright)}
.person .nm{font-weight:600;font-size:17px;min-width:0;overflow-wrap:anywhere}
.person .sub{grid-column:1/-1;color:var(--muted);font-size:14px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.code{font-family:var(--f-display);font-size:14px;letter-spacing:.05em;color:var(--navy)}
.chip.p1{background:var(--gold-bg);color:var(--gold)}
.chip.p2{background:var(--silver-bg);color:var(--silver)}
.chip.p3{background:var(--bronze-bg);color:var(--bronze)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:22px;margin-bottom:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);padding:11px 16px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);min-height:44px;text-decoration:none}
.btn:hover{border-color:var(--cyan-bright)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.small{min-height:34px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--cyan);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(8,10,30,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(12px,env(safe-area-inset-top,0px)) max(0px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(0px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);width:min(760px,100%);border-radius:14px;margin-inline:8px;display:grid;gap:14px;padding:16px max(16px,env(safe-area-inset-left,0px)) 20px max(16px,env(safe-area-inset-right,0px))}
.sheet-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.sheet-top h2{font-size:28px;overflow-wrap:anywhere}
.sheet-top .sub{color:var(--muted)}
.close{flex:0 0 auto;border:0;background:var(--surface-2);border-radius:999px;width:40px;height:40px;font-size:22px;cursor:pointer;line-height:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--bg)}
.preview{position:relative;background:#FFFFFF;border-radius:6px;box-shadow:0 2px 14px rgba(10,12,40,.18);aspect-ratio:1.4142/1;max-width:100%;overflow:hidden;display:grid;place-items:center}
.preview img{width:100%;height:100%;display:block}
.preview .wait{color:#586082;font-size:14px}
.status{font-size:15px;padding:10px 12px;border-radius:var(--r);background:var(--surface-2)}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.bad{background:var(--bad-bg);color:var(--bad)}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.panel h3{font-size:20px}
.field{display:grid;gap:4px}
.field>span{font-size:14px;font-weight:600;color:var(--muted)}
.field .input{font-size:16px;padding:10px 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--cyan-bright);width:0}
.copybox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;user-select:all;background:var(--surface-2);padding:10px;border-radius:8px;overflow-wrap:anywhere}

/* admin */
.pubbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:0 4px 14px rgba(10,12,40,.08)}
.pubbar .msg{min-width:0;font-size:15px}
.pubbar .msg b{font-family:var(--f-display);font-size:18px}
.atabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1.5px solid var(--line)}
.atabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.atabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--cyan-bright)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
tr.dim td{opacity:.55}
td .orig{display:block;color:var(--muted);font-size:12px}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--cyan-bright)}
.foot{color:var(--muted);font-size:13px;padding-block:6px 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#view,#results{display:grid;gap:16px;min-width:0}
@media (max-width:600px){.sheet-bg{padding:0}.sheet{margin:0;border-radius:0;min-height:100%;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}}
#tab{display:grid;gap:16px;min-width:0}
.sheet{align-content:start}

function parseCsv(text) {

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += ch;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }

  return { hdr, rows: rows.filter(r => r.some(c => String(c).trim() !== "")).map(r => { const o = {}; hdr.forEach((h, i) => o[h] = (r[i] || "").trim()); return o; }) };

function planOfficials(parsed) {

  const h = k => hdr.find(x => x.toLowerCase() === k);
  const hn = h("name"), hnat = h("nation") || h("country") || h("team"), hr = h("role");
  if (!hn || !hnat || !hr) return { error: "The officials CSV needs Name, Nation and Role columns." };
  const items = [], skipped = [];
  rows.forEach(r => {
    const name = r[hn].trim(), role = r[hr].trim(); if (!name) return;
    const nat = nationFor(r[hnat]);
    const k = /jury/i.test(role) ? "jury" : /referee/i.test(role) ? "referee" : "official";
    items.push({ id: slug(name + "|" + nat.code + "|" + role), code: nat.code, e: { k, n: name, nat: nat.name, code: nat.code, div: "", wc: "", pl: null, res: null, ev: "", g: "", s: "", role } });
  });
  return finishPlan(items, skipped, "Officials list");
}
function finishPlan(items, skipped, label) {
  const plan = { label, add: [], upd: [], same: 0, skipped, byCode: {} };
  const seen = new Set();
  items.forEach(it => {
    if (seen.has(it.id)) return; seen.add(it.id);
    const cur = (A.nations[it.code] || {})[it.id];
    const fields = ["k", "n", "nat", "code", "div", "wc", "pl", "res", "sq", "bp", "dl", "ev", "s", "role"];
    if (cur && !cur.del) {
      const changed = fields.filter(f => String(cur[f] == null ? "" : cur[f]) !== String(it.e[f] == null ? "" : it.e[f]));
      if (!changed.length) { plan.same++; return; }
      plan.upd.push({ it, changed });
      (plan.byCode[it.code] = plan.byCode[it.code] || {})[it.id] = Object.assign({}, it.e, { at: new Date().toISOString() });
    } else {
      plan.add.push({ it });
      (plan.byCode[it.code] = plan.byCode[it.code] || {})[it.id] = Object.assign({ fix: "", hide: false, del: false, src: "csv", test: false }, it.e, { at: new Date().toISOString() });
    }
  });
  return plan;
}

const MAP_FIELDS = [

  ["event", "Event (SBD / B)", false], ["division", "Division or age class", false], ["wc", "Weight class", false], ["place", "Place", false], ["result", "Total (kg)", false], ["sq", "Best squat", false], ["bp", "Best bench press", false], ["dl", "Best deadlift", false]
];
const AUTO_RESULT = "__auto__";
function findCol(hdr, names) {
  const low = hdr.map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ""));
  for (const n of names) { const i = low.indexOf(n); if (i >= 0) return hdr[i]; }
  for (const n of names) { const i = low.findIndex(h => h.includes(n)); if (i >= 0) return hdr[i]; }
  return "";
}
function guessMap(hdr) {
  const isOpl = hdr.includes("WeightClassKg") || hdr.includes("TotalKg");
  const total = findCol(hdr, ["totalkg", "total"]), bench = findCol(hdr, ["best3benchkg", "bestbench", "benchkg", "bench"]);
  return {
    format: isOpl ? "OpenPowerlifting" : "Spreadsheet",
    name: findCol(hdr, ["name", "lifter", "athlete", "fullname"]),
    nation: findCol(hdr, ["country", "nation", "team", "federation"]),
    sex: findCol(hdr, ["sex", "gender"]),
    equip: findCol(hdr, ["equipment", "rawequipped"]),
    event: findCol(hdr, ["event"]),
    division: findCol(hdr, ["division", "ageclass", "category", "agegroup"]),
    wc: findCol(hdr, ["weightclasskg", "weightclass", "class", "wc"]),
    place: findCol(hdr, ["place", "placing", "rank", "position"]),
    result: total && bench ? AUTO_RESULT : (total || bench),
    sq: findCol(hdr, ["best3squatkg", "bestsquat", "squatkg", "squat"]),

}
function sexWord(v) { v = String(v || "").trim().toLowerCase(); if (!v) return ""; if (/^(m|male|man|men|men's)$/.test(v)) return "Men's"; if (/^(f|female|woman|women|women's)$/.test(v)) return "Women's"; if (v === "mx") return "Mx"; return ""; }
function equipWord(v) { v = String(v || "").trim().toLowerCase(); if (!v) return ""; if (/raw|classic|wraps|unequipped/.test(v)) return "Raw"; if (/ply|equip|unlimited/.test(v)) return "Equipped"; return ""; }

function planMapped(parsed, m) {
  if (!m.name || !m.nation) return { error: "Choose which columns hold the lifter name and the nation." };
  const total = findCol(parsed.hdr, ["totalkg", "total"]), bench = findCol(parsed.hdr, ["best3benchkg", "bestbench", "benchkg", "bench"]);
  const items = [], skipped = [];
  parsed.rows.forEach(r => {
    if (m.meetCol && m.meet && r[m.meetCol] !== m.meet) return;
    const name = (r[m.name] || "").trim(); if (!name) return;
    const nat = nationFor(r[m.nation]);
    const ev = m.event ? (isBenchOnly(r[m.event]) ? "BP" : "PL") : null;
    let div = m.division ? (r[m.division] || "").trim() : "";
    const evGuess = ev || (/bench/i.test(div) ? "BP" : "PL");
    const sx = m.sex ? sexWord(r[m.sex]) : "", eq = m.equip ? equipWord(r[m.equip]) : "";

    if (sx && !/\b(men|women|male|female)/i.test(div)) parts.push(sx);
    if (eq && !/\b(raw|classic|equipped)/i.test(div)) parts.push(eq);
    if (ev === "BP" && !/bench/i.test(div)) parts.push("Bench Press");
    div = parts.concat(div ? [div] : []).join(" ").trim() || (evGuess === "BP" ? "Bench Press" : "Powerlifting");

}

let qrLib = null;
function loadQr() {
  if (window.qrcode) return Promise.resolve(window.qrcode);
  if (qrLib) return qrLib;
  const urls = ["https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js", "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"];
  qrLib = new Promise((res, rej) => {
    const tryNext = i => {
      if (i >= urls.length) { qrLib = null; return rej(new Error("qr")); }
      const s = document.createElement("script"); s.src = urls[i]; s.async = true;
      s.onload = () => window.qrcode ? res(window.qrcode) : tryNext(i + 1); s.onerror = () => tryNext(i + 1);
      document.head.appendChild(s);
    };
    tryNext(0);
  });
  return qrLib;
}
